<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>iotdisplay — starting</title>
<style>
  /* Fully self-contained: this page is shown precisely when the network
     may not be up yet, so no external fonts/scripts/stylesheets. */
  html, body {
    margin: 0;
    height: 100%;
    background: #10141a;
    color: #e8ecf1;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { text-align: center; }
  .spinner {
    width: 48px;
    height: 48px;
    margin: 0 auto 24px;
    border: 4px solid #2a3340;
    border-top-color: #5b9dff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 15px; color: #8b95a5; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Starting up…</h1>
    <p>Waiting for network and the kiosk page to load.</p>
  </div>
</body>
</html>
