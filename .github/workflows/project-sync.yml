name: Project Label Sync

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sync-project-label:
    runs-on: ubuntu-latest
    steps:
      - name: Get linked issue from PR body
        id: get-issue
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # Extract issue number from PR body (e.g., "Fixes #123")
          ISSUE_NUMBER=$(printf '%s' "$PR_BODY" | grep -oP '(?i)(Fixes|Closes|Resolves)\s+#\K[0-9]+' | head -1 || true)
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Check if issue has project label
        if: steps.get-issue.outputs.issue_number != ''
        id: check-label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          TARGET_REPO="${{ github.event.pull_request.base.repo.full_name }}"
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo "$TARGET_REPO" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "YOUR_PROJECT_LABEL"; then
            echo "has_label=true" >> $GITHUB_OUTPUT
          else
            echo "has_label=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Add project label to issue if missing
        if: steps.get-issue.outputs.issue_number != '' && steps.check-label.outputs.has_label == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          TARGET_REPO="${{ github.event.pull_request.base.repo.full_name }}"
          gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" --add-label "YOUR_PROJECT_LABEL"
        shell: bash
