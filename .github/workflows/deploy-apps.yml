name: Build and deploy apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'azure/functions/game/**'
      - 'power apps/game-box-control/**'
      - 'power pages/copilotiotgame/**'
      - '!power pages/copilotiotgame/.powerpages-site/**'
      - 'power pages/prize wheel/**'
      - '!power pages/prize wheel/.powerpages-site/**'
      - 'power pages/plinko/**'
      - '!power pages/plinko/.powerpages-site/**'
      - 'power pages/mcpquest/**'
      - '!power pages/mcpquest/.powerpages-site/**'
      - '.github/workflows/deploy-apps.yml'
      - 'connectors/iot-game-staff/**'
      - 'azure/infrastructure/scripts/Deploy-StaffConnector.ps1'
      - 'azure/infrastructure/staff-api.bicep'
      - 'azure/infrastructure/modules/staff-resources.bicep'
      - 'azure/infrastructure/staff-api.prod.json'
      - 'azure/infrastructure/scripts/Deploy-StaffApi.ps1'
      - 'azure/infrastructure/scripts/Deploy-CodeSite.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      connector: ${{ steps.decide.outputs.connector }}
      any_frontend: ${{ steps.decide.outputs.any_frontend }}
      frontend_matrix: ${{ steps.decide.outputs.frontend_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide which deploy legs are needed
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Manual runs redeploy everything; otherwise diff this push's range.
          force_all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            force_all=true
            files=""
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            fi
            if [ -z "$base" ]; then
              force_all=true   # no comparable base (first push): be safe and deploy all
              files=""
            else
              files="$(git diff --name-only "$base" "$HEAD_SHA")"
            fi
          fi
          echo "Changed files:"; echo "${files:-<none / forced>}"
          matches() { [ -n "$files" ] && printf '%s\n' "$files" | grep -qE "$1"; }
          # Shared deploy logic or this workflow itself => redeploy everything.
          if matches '^\.github/workflows/deploy-apps\.yml$' || matches '^azure/infrastructure/scripts/Deploy-CodeSite\.ps1$'; then
            force_all=true
          fi
          want() { [ "$force_all" = true ] && return 0; matches "$1"; }

          if want '^azure/functions/game/|^azure/infrastructure/(staff-api\.bicep|staff-api\.prod\.json|modules/staff-resources\.bicep|scripts/Deploy-StaffApi\.ps1)$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if want '^connectors/iot-game-staff/|^azure/infrastructure/(scripts/Deploy-StaffConnector\.ps1|staff-api\.prod\.json)$'; then
            echo "connector=true" >> "$GITHUB_OUTPUT"
          else
            echo "connector=false" >> "$GITHUB_OUTPUT"
          fi

          include=""
          add() { include="${include}{\"kind\":\"$1\",\"label\":\"$2\",\"artifact\":\"$3\"},"; }
          want '^power apps/game-box-control/' && add "code-app" "Code App" "code-app" || true
          want '^power pages/copilotiotgame/' && add "kiosk" "kiosk Code Site" "power-pages-kiosk" || true
          want '^power pages/prize wheel/' && add "prize-wheel" "Prize Wheel Code Site" "power-pages-prize-wheel" || true
          want '^power pages/plinko/' && add "plinko" "Plinko Code Site" "power-pages-plinko" || true
          want '^power pages/mcpquest/' && add "mcpquest" "MCP Quest Code Site" "power-pages-mcpquest" || true
          include="${include%,}"
          echo "frontend_matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
          if [ -n "$include" ]; then echo "any_frontend=true" >> "$GITHUB_OUTPUT"; else echo "any_frontend=false" >> "$GITHUB_OUTPUT"; fi
          echo "Resolved deploy plan: backend=$( [ "$force_all" = true ] && echo forced ) frontend_matrix={\"include\":[${include}]}"

  build-function:
    name: Build Function App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: azure/functions/game/package-lock.json
      - name: Validate staff provisioning template
        run: az bicep build --file azure/infrastructure/staff-api.bicep --stdout > /dev/null
      - name: Test staff provisioning guards offline
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-StaffDeployment.ps1
      - name: Build and test Function App
        working-directory: azure/functions/game
        run: |
          npm ci
          npm run build
          npm test
          npm prune --omit=dev
      - name: Package Function App
        run: |
          mkdir -p function-package
          cp azure/functions/game/host.json azure/functions/game/package.json azure/functions/game/package-lock.json function-package/
          cp -r azure/functions/game/dist azure/functions/game/node_modules function-package/
          test -f function-package/dist/src/index.js
          cd function-package
          zip -qr ../function-app.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14

  build-code-app:
    name: Build Code App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power apps/game-box-control/package-lock.json
      - name: Build
        working-directory: power apps/game-box-control
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: code-app
          path: |
            power apps/game-box-control/
            !power apps/game-box-control/node_modules/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build-kiosk:
    name: Build kiosk Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/copilotiotgame/package-lock.json
      - name: Build
        working-directory: power pages/copilotiotgame
        env:
          VITE_API_BASE_URL: https://func-aw-iot-game-v2.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-kiosk
          path: |
            power pages/copilotiotgame/dist/
            power pages/copilotiotgame/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build-prize-wheel:
    name: Build Prize Wheel Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/prize wheel/package-lock.json
      - name: Build
        working-directory: power pages/prize wheel
        env:
          VITE_API_BASE_URL: https://func-aw-iot-game-v2.azurewebsites.net
          VITE_SOLUTION_DIAGRAM_URL: ${{ vars.SOLUTION_DIAGRAM_URL || 'https://copilotiotgame.powerappsportals.com/kiosk/solution' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-prize-wheel
          path: |
            power pages/prize wheel/dist/
            power pages/prize wheel/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build-plinko:
    name: Build Plinko Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/plinko/package-lock.json
      - name: Build
        working-directory: power pages/plinko
        env:
          VITE_API_BASE_URL: https://func-aw-iot-game-v2.azurewebsites.net
          VITE_PRIZE_WHEEL_URL: ${{ vars.PRIZE_WHEEL_URL || 'https://andworxprizewheel.powerappsportals.com' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-plinko
          path: |
            power pages/plinko/dist/
            power pages/plinko/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build-mcpquest:
    name: Build MCP Quest Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/mcpquest/package-lock.json
      - name: Build
        working-directory: power pages/mcpquest
        env:
          # A live build talks to the Function App and ships none of the judge or case logic.
          VITE_MCPQUEST_API: live
          VITE_API_BASE_URL: https://func-aw-iot-game-v2.azurewebsites.net
          VITE_PRIZE_WHEEL_URL: ${{ vars.PRIZE_WHEEL_URL || 'https://andworxprizewheel.powerappsportals.com' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - name: Verify the live bundle contains no case logic
        working-directory: power pages/mcpquest
        run: |
          if grep -rlE "Hand-sorted queue|Sign-off by email chain|owningTeams|mcpstation\.io" dist/assets; then
            echo '::error::The live bundle contains case logic or the MCP Station URL.'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-mcpquest
          path: |
            power pages/mcpquest/dist/
            power pages/mcpquest/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build apps
    needs: [build-function, build-code-app, build-kiosk, build-prize-wheel, build-plinko, build-mcpquest]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All application builds passed.'

  deploy-backends:
    name: Deploy and verify backends
    needs: [build, changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_MIGRATION_FREEZE != 'true' && needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: 9e8c862e-9bba-4363-a21b-c45cabe8b637
      AZURE_FUNCTIONAPP_NAME: func-aw-iot-game-v2
      STAFF_API_CUTOVER_READY: ${{ vars.STAFF_API_CUTOVER_READY || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Azure deployment configuration
        shell: pwsh
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_FUNCTIONAPP_NAME')
          if ($env:STAFF_API_CUTOVER_READY -notin @('true', 'false')) { throw 'STAFF_API_CUTOVER_READY must be true or false.' }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md." }
          }
      - name: Load staff deployment configuration
        shell: pwsh
        run: |
          $config = Get-Content azure/infrastructure/staff-api.prod.json -Raw | ConvertFrom-Json
          if ($config.sourceFunctionAppName -ne $env:AZURE_FUNCTIONAPP_NAME) { throw 'Staff source app differs from configured public app.' }
          if ($config.tenantId -ne $env:AZURE_TENANT_ID) { throw 'Staff configuration belongs to another tenant.' }
          "AZURE_RESOURCE_GROUP=$($config.resourceGroup)" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v8
        with:
          name: function-app
          path: function-artifact
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: 9e8c862e-9bba-4363-a21b-c45cabe8b637
      - name: Validate staff connector binding
        if: env.STAFF_API_CUTOVER_READY == 'true'
        shell: pwsh
        working-directory: power apps/game-box-control
        run: node scripts/verify-staff-binding.mjs
      - name: Preview and provision staff API
        id: staff_infra
        shell: pwsh
        run: ./azure/infrastructure/scripts/Deploy-StaffApi.ps1 -Mode Deploy
      - name: Deploy staff Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-aw-iot-staff-v2
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false
      - name: Verify staff API rejects unauthenticated requests
        shell: pwsh
        env:
          STAFF_HOST: ${{ steps.staff_infra.outputs.hostName }}
        run: |
          $verified = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest "https://$env:STAFF_HOST/api/kiosk-state" -SkipHttpErrorCheck -TimeoutSec 15
              if ($response.StatusCode -eq 401) { $verified = $true; break }
              if ($response.StatusCode -eq 200) { throw 'Staff API accepted an unauthenticated request.' }
            } catch {
              if ($_.Exception.Message -like '*accepted an unauthenticated*') { throw }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $verified) { throw 'Staff API did not return 401. Stopping before public/frontend cutover.' }
      - name: Select public API surface before coordinated cutover
        if: env.STAFF_API_CUTOVER_READY == 'true'
        shell: pwsh
        run: |
          az functionapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_FUNCTIONAPP_NAME" --settings API_SURFACE=public --only-show-errors --output none
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the public API surface.' }
      - name: Deploy public Function App
        if: env.STAFF_API_CUTOVER_READY == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false
  deploy-connector:
    name: Deploy staff connector
    needs: [build, changes, deploy-backends]
    # always() so a skipped (unchanged) backend does not skip the connector; a failed backend still blocks it.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.AZURE_MIGRATION_FREEZE != 'true'
      && needs.build.result == 'success'
      && needs.changes.result == 'success'
      && needs.changes.outputs.connector == 'true'
      && needs.deploy-backends.result != 'failure'
      && needs.deploy-backends.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: production
    env:
      POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      POWER_PLATFORM_SOLUTION_NAME: ${{ vars.POWER_PLATFORM_SOLUTION_NAME || 'CopilotIoTGame' }}
      # Optional. When unset the connector keeps the secret already stored on it in Power Platform.
      STAFF_CONNECTOR_CLIENT_SECRET: ${{ secrets.STAFF_CONNECTOR_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Power Platform deployment configuration
        shell: pwsh
        run: |
          foreach ($name in @('POWER_PLATFORM_ENVIRONMENT_URL', 'POWER_PLATFORM_TENANT_ID', 'POWER_PLATFORM_CLIENT_ID', 'POWER_PLATFORM_CLIENT_SECRET', 'POWER_PLATFORM_SOLUTION_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md." }
          }
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Authenticate Power Platform
        shell: pwsh
        run: |
          pac auth create --name "github-connector" --tenant "$env:POWER_PLATFORM_TENANT_ID" --applicationId "$env:POWER_PLATFORM_CLIENT_ID" --clientSecret "$env:POWER_PLATFORM_CLIENT_SECRET" --url "$env:POWER_PLATFORM_ENVIRONMENT_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform authentication failed.' }
      - name: Create or update the staff custom connector
        shell: pwsh
        run: ./azure/infrastructure/scripts/Deploy-StaffConnector.ps1 -SolutionName "$env:POWER_PLATFORM_SOLUTION_NAME"
      - name: Clear PAC credentials
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'PAC credential cleanup failed.' }
          }

  deploy-frontends:
    name: Deploy ${{ matrix.label }}
    needs: [build, changes, deploy-backends, deploy-connector]
    # always() so a skipped (unchanged) backend does not skip the frontends; the
    # result guards still block a frontend deploy when a backend change failed.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.STAFF_API_CUTOVER_READY == 'true'
      && vars.AZURE_MIGRATION_FREEZE != 'true'
      && needs.build.result == 'success'
      && needs.changes.result == 'success'
      && needs.changes.outputs.any_frontend == 'true'
      && needs.deploy-backends.result != 'failure'
      && needs.deploy-backends.result != 'cancelled'
      && needs.deploy-connector.result != 'failure'
      && needs.deploy-connector.result != 'cancelled'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.changes.outputs.frontend_matrix) }}
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    env:
      POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      POWER_PLATFORM_SOLUTION_NAME: ${{ vars.POWER_PLATFORM_SOLUTION_NAME || 'CopilotIoTGame' }}
      KIOSK_WEBSITE_ID: ${{ vars.POWER_PAGES_WEBSITE_ID || '4938f099-b8dd-485f-a5c2-3c4ad4b7e02a' }}
      PRIZE_WHEEL_WEBSITE_ID: ${{ vars.POWER_PRIZE_WHEEL_WEBSITE_ID || '5dadde98-1e91-4a34-8182-1b0a87466e58' }}
      PLINKO_WEBSITE_ID: ${{ vars.POWER_PLINKO_WEBSITE_ID }}
      MCPQUEST_WEBSITE_ID: ${{ vars.POWER_MCPQUEST_WEBSITE_ID || '4fb95e05-e635-4f0c-a0e3-4065f5dfb72a' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifact
      - name: Validate Power Platform deployment configuration
        shell: pwsh
        run: |
          foreach ($name in @('POWER_PLATFORM_ENVIRONMENT_URL', 'POWER_PLATFORM_TENANT_ID', 'POWER_PLATFORM_CLIENT_ID', 'POWER_PLATFORM_CLIENT_SECRET', 'POWER_PLATFORM_SOLUTION_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md." }
          }
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Authenticate Power Platform
        shell: pwsh
        run: |
          pac auth create --name "github-${{ matrix.kind }}" --tenant "$env:POWER_PLATFORM_TENANT_ID" --applicationId "$env:POWER_PLATFORM_CLIENT_ID" --clientSecret "$env:POWER_PLATFORM_CLIENT_SECRET" --url "$env:POWER_PLATFORM_ENVIRONMENT_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform authentication failed.' }
      - name: Push Power Apps Code App
        if: matrix.kind == 'code-app'
        shell: pwsh
        working-directory: artifact
        run: |
          pac code push --environment "$env:POWER_PLATFORM_ENVIRONMENT_URL" --solutionName "$env:POWER_PLATFORM_SOLUTION_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Power Apps Code App push failed.' }
      - name: Upload pinned Power Pages Code Site
        if: matrix.kind != 'code-app'
        shell: pwsh
        run: |
          $websiteId = switch ('${{ matrix.kind }}') {
            'kiosk' { $env:KIOSK_WEBSITE_ID }
            'prize-wheel' { $env:PRIZE_WHEEL_WEBSITE_ID }
            'plinko' { $env:PLINKO_WEBSITE_ID }
            'mcpquest' { $env:MCPQUEST_WEBSITE_ID }
            default { throw 'Unknown Power Pages Code Site kind.' }
          }
          if ([string]::IsNullOrWhiteSpace($websiteId)) { throw 'Missing the website ID for ${{ matrix.kind }}. Create the Code Site, then set its POWER_*_WEBSITE_ID variable before deployment (see docs/CI_CD.md).' }
          ./azure/infrastructure/scripts/Deploy-CodeSite.ps1 -ArtifactPath 'artifact' -WebsiteId $websiteId -SiteLabel '${{ matrix.kind }}'
      - name: Clear PAC credentials
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'PAC credential cleanup failed.' }
          }

  deploy:
    name: Deploy production apps
    needs: [deploy-backends, deploy-connector, deploy-frontends]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_MIGRATION_FREEZE != 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: 9e8c862e-9bba-4363-a21b-c45cabe8b637
      AZURE_RESOURCE_GROUP: rg-aw-azcom-iot-copilot
      STAFF_API_CUTOVER_READY: ${{ vars.STAFF_API_CUTOVER_READY || 'false' }}
    steps:
      - name: Verify deployment fan-out
        env:
          BACKEND_RESULT: ${{ needs.deploy-backends.result }}
          CONNECTOR_RESULT: ${{ needs.deploy-connector.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontends.result }}
          CUTOVER_READY: ${{ vars.STAFF_API_CUTOVER_READY || 'false' }}
        run: |
          # Unchanged components are skipped (selective deploy), which is a pass;
          # only a real failure/cancellation of a leg that ran should fail the run.
          case "$BACKEND_RESULT" in failure|cancelled) echo "::error::Backend deploy $BACKEND_RESULT"; exit 1 ;; esac
          case "$CONNECTOR_RESULT" in failure|cancelled) echo "::error::Connector deploy $CONNECTOR_RESULT"; exit 1 ;; esac
          if test "$CUTOVER_READY" = true; then
            case "$FRONTEND_RESULT" in failure|cancelled) echo "::error::Frontend deploy $FRONTEND_RESULT"; exit 1 ;; esac
          fi
          echo "All required application deployments passed (backend=$BACKEND_RESULT, frontend=$FRONTEND_RESULT)."
      - uses: azure/login@v3
        if: env.STAFF_API_CUTOVER_READY == 'true'
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: 9e8c862e-9bba-4363-a21b-c45cabe8b637
      - name: Enable destination telemetry and maintenance
        if: env.STAFF_API_CUTOVER_READY == 'true'
        shell: pwsh
        run: |
          foreach ($app in @('func-aw-iot-game-v2', 'func-aw-iot-staff-v2')) {
            az functionapp config appsettings set -g $env:AZURE_RESOURCE_GROUP -n $app --settings MIGRATION_STAGING=false --only-show-errors --output none
            if ($LASTEXITCODE -ne 0) { throw "Could not activate background functions on $app." }
          }
