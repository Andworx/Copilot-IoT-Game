name: Build and deploy apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'azure/**'
      - 'power apps/game-box-control/**'
      - 'power pages/copilotiotgame/**'
      - '!power pages/copilotiotgame/.powerpages-site/**'
      - '.github/workflows/deploy-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            azure/package-lock.json
            power apps/game-box-control/package-lock.json
            power pages/copilotiotgame/package-lock.json
      - name: Build Function App
        working-directory: azure
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Package Function App
        run: |
          mkdir -p function-package
          cp azure/host.json azure/package.json azure/package-lock.json function-package/
          cp -r azure/dist azure/node_modules function-package/
          test -f function-package/dist/src/index.js
          cd function-package
          zip -qr ../function-app.zip .
      - name: Build Power Pages Code Site
        working-directory: power pages/copilotiotgame
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - name: Build Power Apps Code App
        working-directory: power apps/game-box-control
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages
          # .powerpages-site/ (site metadata + manifest) is deliberately NOT built from the
          # repo: the deploy job downloads it from the live site by website ID so
          # pac pages upload-code-site updates that site instead of creating a new one.
          path: |
            power pages/copilotiotgame/dist/
            power pages/copilotiotgame/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production apps
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_SOLUTION_NAME: ${{ vars.POWER_PLATFORM_SOLUTION_NAME || 'CopilotIoTGame' }}
      POWER_PAGES_WEBSITE_ID: ${{ vars.POWER_PAGES_WEBSITE_ID || '4938f099-b8dd-485f-a5c2-3c4ad4b7e02a' }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      VITE_SET_MODE_FUNCTION_KEY: ${{ secrets.CODE_APP_SET_MODE_FUNCTION_KEY }}
      VITE_TOGGLE_DEVICE_FUNCTION_KEY: ${{ secrets.CODE_APP_TOGGLE_DEVICE_FUNCTION_KEY }}
      VITE_SET_GAME_MODE_FUNCTION_KEY: ${{ secrets.CODE_APP_SET_GAME_MODE_FUNCTION_KEY }}
      VITE_BULK_CREATE_PRIZES_FUNCTION_KEY: ${{ secrets.CODE_APP_BULK_CREATE_PRIZES_FUNCTION_KEY }}
    steps:
      - name: Validate deployment configuration
        shell: pwsh
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_FUNCTIONAPP_NAME', 'POWER_PLATFORM_ENVIRONMENT_URL', 'POWER_PLATFORM_TENANT_ID', 'POWER_PLATFORM_CLIENT_ID', 'POWER_PLATFORM_CLIENT_SECRET', 'POWER_PLATFORM_SOLUTION_NAME', 'VITE_SET_MODE_FUNCTION_KEY', 'VITE_TOGGLE_DEVICE_FUNCTION_KEY', 'VITE_SET_GAME_MODE_FUNCTION_KEY', 'VITE_BULK_CREATE_PRIZES_FUNCTION_KEY')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md."
            }
          }
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: function-app
          path: function-artifact
      - uses: actions/download-artifact@v8
        with:
          name: power-pages
          path: power-pages-artifact
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power apps/game-box-control/package-lock.json
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Authenticate Power Platform
        shell: pwsh
        run: |
          pac auth create --name github-production --tenant "$env:POWER_PLATFORM_TENANT_ID" --applicationId "$env:POWER_PLATFORM_CLIENT_ID" --clientSecret "$env:POWER_PLATFORM_CLIENT_SECRET" --url "$env:POWER_PLATFORM_ENVIRONMENT_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform authentication failed.' }
      - name: Build Power Apps Code App for deployment
        shell: pwsh
        working-directory: power apps/game-box-control
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          if (-not (Test-Path 'dist/index.html')) { throw 'Power Apps Code App build output is missing.' }
      - name: Push Power Apps Code App
        shell: pwsh
        working-directory: power apps/game-box-control
        run: |
          pac code push --environment "$env:POWER_PLATFORM_ENVIRONMENT_URL" --solutionName "$env:POWER_PLATFORM_SOLUTION_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Power Apps Code App push failed.' }
      - name: Fetch live Power Pages site metadata
        shell: pwsh
        run: |
          # pac pages upload-code-site has no website-ID parameter: it matches the
          # target site through the .powerpages-site/ folder next to the compiled
          # code. A checked-in copy drifts (every upload rewrote its IDs, so each
          # deploy created a brand-new "CopilotIoTGame" website and the live one was
          # never touched). Download the live site's real metadata by ID instead, and
          # stop here rather than letting pac create a new site if that fails.
          $download = Join-Path $env:RUNNER_TEMP 'live-site'
          pac pages download-code-site --path $download --webSiteId $env:POWER_PAGES_WEBSITE_ID --overwrite
          if ($LASTEXITCODE -ne 0) { throw "Could not download Power Pages website $env:POWER_PAGES_WEBSITE_ID. Refusing to upload, which would create a new site." }
          $meta = Get-ChildItem $download -Recurse -Directory -Force -Filter '.powerpages-site' | Select-Object -First 1
          if (-not $meta) { throw 'Downloaded site has no .powerpages-site folder.' }
          $id = (Select-String -Path (Join-Path $meta.FullName 'website.yml') -Pattern '^id:\s*(\S+)').Matches[0].Groups[1].Value
          if ($id -ne $env:POWER_PAGES_WEBSITE_ID) { throw "Downloaded website id $id does not match $env:POWER_PAGES_WEBSITE_ID." }
          Remove-Item 'power-pages-artifact/.powerpages-site' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $meta.FullName 'power-pages-artifact/.powerpages-site' -Recurse
      - name: Upload Power Pages Code Site
        shell: pwsh
        working-directory: power-pages-artifact
        run: |
          pac pages upload-code-site --rootPath "."
          if ($LASTEXITCODE -ne 0) { throw 'Power Pages Code Site upload failed.' }
      - name: Verify Power Pages upload targeted the live site
        shell: pwsh
        working-directory: power-pages-artifact
        run: |
          $id = (Select-String -Path '.powerpages-site/website.yml' -Pattern '^id:\s*(\S+)').Matches[0].Groups[1].Value
          if ($id -ne $env:POWER_PAGES_WEBSITE_ID) {
            throw "Upload used website $id instead of $env:POWER_PAGES_WEBSITE_ID; a duplicate site was created and must be deleted."
          }
          Write-Host "Power Pages upload targeted website $id."
      - name: Clear PAC credentials
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'PAC credential cleanup failed.' }
          }
