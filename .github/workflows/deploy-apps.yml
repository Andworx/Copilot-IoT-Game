name: Build and deploy apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'azure/**'
      - 'power apps/game-box-control/**'
      - 'power pages/copilotiotgame/**'
      - '!power pages/copilotiotgame/.powerpages-site/**'
      - 'power pages/prize wheel/**'
      - '!power pages/prize wheel/.powerpages-site/**'
      - '.github/workflows/deploy-apps.yml'
      - 'infra/staff-api.bicep'
      - 'infra/modules/staff-resources.bicep'
      - 'infra/staff-api.prod.json'
      - 'infra/scripts/Deploy-StaffApi.ps1'
      - 'infra/scripts/Deploy-CodeSite.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-function:
    name: Build Function App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: azure/package-lock.json
      - name: Validate staff provisioning template
        run: az bicep build --file infra/staff-api.bicep --stdout > /dev/null
      - name: Test staff provisioning guards offline
        shell: pwsh
        run: ./infra/scripts/Test-StaffDeployment.ps1
      - name: Build and test Function App
        working-directory: azure
        run: |
          npm ci
          npm run build
          npm test
          npm prune --omit=dev
      - name: Package Function App
        run: |
          mkdir -p function-package
          cp azure/host.json azure/package.json azure/package-lock.json function-package/
          cp -r azure/dist azure/node_modules function-package/
          test -f function-package/dist/src/index.js
          cd function-package
          zip -qr ../function-app.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14

  build-code-app:
    name: Build Code App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power apps/game-box-control/package-lock.json
      - name: Build
        working-directory: power apps/game-box-control
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: code-app
          path: |
            power apps/game-box-control/
            !power apps/game-box-control/node_modules/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build-kiosk:
    name: Build kiosk Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/copilotiotgame/package-lock.json
      - name: Build
        working-directory: power pages/copilotiotgame
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-kiosk
          path: |
            power pages/copilotiotgame/dist/
            power pages/copilotiotgame/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build-prize-wheel:
    name: Build Prize Wheel Code Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power pages/prize wheel/package-lock.json
      - name: Build
        working-directory: power pages/prize wheel
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
          VITE_SOLUTION_DIAGRAM_URL: ${{ vars.SOLUTION_DIAGRAM_URL || 'https://copilotiotgame.powerappsportals.com/kiosk/solution' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages-prize-wheel
          path: |
            power pages/prize wheel/dist/
            power pages/prize wheel/powerpages.config.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build apps
    needs: [build-function, build-code-app, build-kiosk, build-prize-wheel]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All application builds passed.'

  deploy-backends:
    name: Deploy and verify backends
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      STAFF_API_CUTOVER_READY: ${{ vars.STAFF_API_CUTOVER_READY || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Azure deployment configuration
        shell: pwsh
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_FUNCTIONAPP_NAME')
          if ($env:STAFF_API_CUTOVER_READY -notin @('true', 'false')) { throw 'STAFF_API_CUTOVER_READY must be true or false.' }
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md." }
          }
      - name: Load staff deployment configuration
        shell: pwsh
        run: |
          $config = Get-Content infra/staff-api.prod.json -Raw | ConvertFrom-Json
          if ($config.sourceFunctionAppName -ne $env:AZURE_FUNCTIONAPP_NAME) { throw 'Staff source app differs from configured public app.' }
          if ($config.tenantId -ne $env:AZURE_TENANT_ID) { throw 'Staff configuration belongs to another tenant.' }
          "AZURE_STAFF_FUNCTIONAPP_NAME=$($config.functionAppName)" >> $env:GITHUB_ENV
          "AZURE_RESOURCE_GROUP=$($config.resourceGroup)" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v8
        with:
          name: function-app
          path: function-artifact
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate staff connector binding
        if: env.STAFF_API_CUTOVER_READY == 'true'
        shell: pwsh
        working-directory: power apps/game-box-control
        run: node scripts/verify-staff-binding.mjs
      - name: Preview and provision staff API
        id: staff_infra
        shell: pwsh
        run: ./infra/scripts/Deploy-StaffApi.ps1 -Mode Deploy
      - name: Deploy staff Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_STAFF_FUNCTIONAPP_NAME }}
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false
      - name: Verify staff API rejects unauthenticated requests
        shell: pwsh
        env:
          STAFF_HOST: ${{ steps.staff_infra.outputs.hostName }}
        run: |
          $verified = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest "https://$env:STAFF_HOST/api/kiosk-state" -SkipHttpErrorCheck -TimeoutSec 15
              if ($response.StatusCode -eq 401) { $verified = $true; break }
              if ($response.StatusCode -eq 200) { throw 'Staff API accepted an unauthenticated request.' }
            } catch {
              if ($_.Exception.Message -like '*accepted an unauthenticated*') { throw }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $verified) { throw 'Staff API did not return 401. Stopping before public/frontend cutover.' }
      - name: Select public API surface before coordinated cutover
        if: env.STAFF_API_CUTOVER_READY == 'true'
        shell: pwsh
        run: |
          az functionapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_FUNCTIONAPP_NAME" --settings API_SURFACE=public --only-show-errors --output none
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the public API surface.' }
      - name: Deploy public Function App
        if: env.STAFF_API_CUTOVER_READY == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false

  deploy-frontends:
    name: Deploy ${{ matrix.label }}
    needs: [build, deploy-backends]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.STAFF_API_CUTOVER_READY == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: code-app
            label: Code App
            artifact: code-app
          - kind: kiosk
            label: kiosk Code Site
            artifact: power-pages-kiosk
          - kind: prize-wheel
            label: Prize Wheel Code Site
            artifact: power-pages-prize-wheel
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    env:
      POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      POWER_PLATFORM_SOLUTION_NAME: ${{ vars.POWER_PLATFORM_SOLUTION_NAME || 'CopilotIoTGame' }}
      KIOSK_WEBSITE_ID: ${{ vars.POWER_PAGES_WEBSITE_ID || '4938f099-b8dd-485f-a5c2-3c4ad4b7e02a' }}
      PRIZE_WHEEL_WEBSITE_ID: ${{ vars.POWER_PRIZE_WHEEL_WEBSITE_ID || '5dadde98-1e91-4a34-8182-1b0a87466e58' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifact
      - name: Validate Power Platform deployment configuration
        shell: pwsh
        run: |
          foreach ($name in @('POWER_PLATFORM_ENVIRONMENT_URL', 'POWER_PLATFORM_TENANT_ID', 'POWER_PLATFORM_CLIENT_ID', 'POWER_PLATFORM_CLIENT_SECRET', 'POWER_PLATFORM_SOLUTION_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md." }
          }
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Authenticate Power Platform
        shell: pwsh
        run: |
          pac auth create --name "github-${{ matrix.kind }}" --tenant "$env:POWER_PLATFORM_TENANT_ID" --applicationId "$env:POWER_PLATFORM_CLIENT_ID" --clientSecret "$env:POWER_PLATFORM_CLIENT_SECRET" --url "$env:POWER_PLATFORM_ENVIRONMENT_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform authentication failed.' }
      - name: Push Power Apps Code App
        if: matrix.kind == 'code-app'
        shell: pwsh
        working-directory: artifact
        run: |
          pac code push --environment "$env:POWER_PLATFORM_ENVIRONMENT_URL" --solutionName "$env:POWER_PLATFORM_SOLUTION_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Power Apps Code App push failed.' }
      - name: Upload pinned Power Pages Code Site
        if: matrix.kind != 'code-app'
        shell: pwsh
        run: |
          $websiteId = if ('${{ matrix.kind }}' -eq 'kiosk') { $env:KIOSK_WEBSITE_ID } else { $env:PRIZE_WHEEL_WEBSITE_ID }
          ./infra/scripts/Deploy-CodeSite.ps1 -ArtifactPath 'artifact' -WebsiteId $websiteId -SiteLabel '${{ matrix.kind }}'
      - name: Clear PAC credentials
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'PAC credential cleanup failed.' }
          }

  deploy:
    name: Deploy production apps
    needs: [deploy-backends, deploy-frontends]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment fan-out
        env:
          BACKEND_RESULT: ${{ needs.deploy-backends.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontends.result }}
          CUTOVER_READY: ${{ vars.STAFF_API_CUTOVER_READY || 'false' }}
        run: |
          test "$BACKEND_RESULT" = success
          if test "$CUTOVER_READY" = true; then test "$FRONTEND_RESULT" = success; fi
          echo 'All required application deployments passed.'
