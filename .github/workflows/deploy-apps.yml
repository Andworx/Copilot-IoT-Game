name: Build and deploy apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'azure/**'
      - 'power apps/game-box-control/**'
      - 'power pages/copilotiotgame/**'
      - '!power pages/copilotiotgame/.powerpages-site/**'
      - '.github/workflows/deploy-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            azure/package-lock.json
            power apps/game-box-control/package-lock.json
            power pages/copilotiotgame/package-lock.json
      - name: Build Function App
        working-directory: azure
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Package Function App
        run: |
          mkdir -p function-package
          cp azure/host.json azure/package.json azure/package-lock.json function-package/
          cp -r azure/dist azure/node_modules function-package/
          test -f function-package/dist/src/index.js
          cd function-package
          zip -qr ../function-app.zip .
      - name: Build Power Pages Code Site
        working-directory: power pages/copilotiotgame
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - name: Build Power Apps Code App
        working-directory: power apps/game-box-control
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME || 'func-aw-azcom-iot-game' }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: function-app.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: power-pages
          # .powerpages-site/ carries the per-environment manifest (RecordId + checksum
          # per Dataverse record) that pac pages upload-code-site needs to recognize an
          # existing site's records instead of treating every upload as a first-time
          # init. Without it, every deploy logged "Deleted 0 bundle directories" and the
          # live site kept serving whatever bundle was there before CI ever ran.
          path: |
            power pages/copilotiotgame/dist/
            power pages/copilotiotgame/powerpages.config.json
            power pages/copilotiotgame/.powerpages-site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production apps
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_SOLUTION_NAME: ${{ vars.POWER_PLATFORM_SOLUTION_NAME || 'CopilotIoTGame' }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      VITE_SET_MODE_FUNCTION_KEY: ${{ secrets.CODE_APP_SET_MODE_FUNCTION_KEY }}
      VITE_TOGGLE_DEVICE_FUNCTION_KEY: ${{ secrets.CODE_APP_TOGGLE_DEVICE_FUNCTION_KEY }}
      VITE_SET_GAME_MODE_FUNCTION_KEY: ${{ secrets.CODE_APP_SET_GAME_MODE_FUNCTION_KEY }}
      VITE_BULK_CREATE_PRIZES_FUNCTION_KEY: ${{ secrets.CODE_APP_BULK_CREATE_PRIZES_FUNCTION_KEY }}
    steps:
      - name: Validate deployment configuration
        shell: pwsh
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_FUNCTIONAPP_NAME', 'POWER_PLATFORM_ENVIRONMENT_URL', 'POWER_PLATFORM_TENANT_ID', 'POWER_PLATFORM_CLIENT_ID', 'POWER_PLATFORM_CLIENT_SECRET', 'POWER_PLATFORM_SOLUTION_NAME', 'VITE_SET_MODE_FUNCTION_KEY', 'VITE_TOGGLE_DEVICE_FUNCTION_KEY', 'VITE_SET_GAME_MODE_FUNCTION_KEY', 'VITE_BULK_CREATE_PRIZES_FUNCTION_KEY')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub deployment setting: $name. See docs/CI_CD.md."
            }
          }
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: function-app
          path: function-artifact
      - uses: actions/download-artifact@v4
        with:
          name: power-pages
          path: power-pages-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: power apps/game-box-control/package-lock.json
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: function-artifact/function-app.zip
          sku: flexconsumption
          remote-build: false
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Authenticate Power Platform
        shell: pwsh
        run: |
          pac auth create --name github-production --tenant "$env:POWER_PLATFORM_TENANT_ID" --applicationId "$env:POWER_PLATFORM_CLIENT_ID" --clientSecret "$env:POWER_PLATFORM_CLIENT_SECRET" --url "$env:POWER_PLATFORM_ENVIRONMENT_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Power Platform authentication failed.' }
      - name: Build Power Apps Code App for deployment
        shell: pwsh
        working-directory: power apps/game-box-control
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
        run: |
          npm ci
          npm run build
          if (-not (Test-Path 'dist/index.html')) { throw 'Power Apps Code App build output is missing.' }
      - name: Push Power Apps Code App
        shell: pwsh
        working-directory: power apps/game-box-control
        run: |
          pac code push --environment "$env:POWER_PLATFORM_ENVIRONMENT_URL" --solutionName "$env:POWER_PLATFORM_SOLUTION_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Power Apps Code App push failed.' }
      - name: Upload Power Pages Code Site
        shell: pwsh
        working-directory: power-pages-artifact
        run: |
          pac pages upload-code-site --rootPath "."
          if ($LASTEXITCODE -ne 0) { throw 'Power Pages Code Site upload failed.' }
      - name: Sync updated Power Pages manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pac just updated power-pages-artifact/.powerpages-site/ in place (new record
          # IDs for anything it created, refreshed checksums for anything it updated).
          # That copy is thrown away when the runner exits -- mirror it back over the
          # repo's checked-in copy and push straight to main if anything actually
          # changed, so the next deploy still knows about every record instead of
          # running blind again the way it did before this manifest was included in
          # the deploy artifact at all (see PR #26). Only touches .powerpages-site/,
          # which is excluded from this workflow's push trigger above, so this commit
          # won't trigger another deploy.
          #
          # NOTE: this pushes directly to main rather than opening a PR because this
          # org disables "Allow GitHub Actions to create and approve pull requests" --
          # gh pr create fails with GraphQL: createPullRequest not permitted. main has
          # no branch protection on this plan, so a direct push is the simplest safe
          # option for this manifest-only, non-redeploying change.
          #
          # Mirror (not merge) the destination so renamed/removed manifest entries
          # don't linger: Copy-Item -Recurse into an *existing* directory nests the
          # source folder inside it (.powerpages-site/.powerpages-site/...), so the
          # destination must be removed first.
          Remove-Item -Path "power pages/copilotiotgame/.powerpages-site" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "power-pages-artifact/.powerpages-site" -Destination "power pages/copilotiotgame/.powerpages-site" -Recurse -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "power pages/copilotiotgame/.powerpages-site"
          $changed = git status --porcelain -- "power pages/copilotiotgame/.powerpages-site"
          if ([string]::IsNullOrWhiteSpace($changed)) {
            Write-Host "Power Pages manifest unchanged -- nothing to sync."
          } else {
            git commit -m "chore(power-pages): sync uploaded code site manifest"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push manifest sync commit to main.' }
          }
      - name: Clear PAC credentials
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pac -ErrorAction SilentlyContinue) {
            pac auth clear
            if ($LASTEXITCODE -ne 0) { throw 'PAC credential cleanup failed.' }
          }
