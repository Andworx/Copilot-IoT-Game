name: Infrastructure

# Azure infrastructure this repo owns (azure/infrastructure/main.bicep). See azure/infrastructure/README.md.
#
#   PRs            Compile + lint the Bicep and check the reference manifest. No cloud credentials.
#   pushes         Compare Bicep on every push to main with Azure. Any actionable difference fails the check and
#                  points the operator to the separately approved deploy action.
#   what-if        Runs the same reconciliation check manually and changes nothing.
#   deploy         Applies main.bicep and merges the Function App's telemetry settings. Only from
#                  `main`, only through the `infra-deploy` environment (which only accepts `main`).
#
# The deploy identity has narrowly scoped write access to the adopted resources, including the VNet,
# private DNS zones, DNS resolver, and VPN. It cannot modify the IoT Hub, DPS, or the legacy Function App
# (azure/infrastructure/scripts/Initialize-InfraIdentities.ps1).

on:
  pull_request:
    paths:
      - 'azure/infrastructure/**'
      - '.github/workflows/deploy-infra.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run against Azure'
        required: true
        default: what-if
        type: choice
        options: [what-if, deploy, network-what-if]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_INFRA_RESOURCE_GROUP: rg-aw-azcom-iot-copilot
  GAME_FUNCTION_APP: func-aw-azcom-iot-game
  GAME_CONSUMER_GROUP: gamefunc

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and lint
        run: |
          az bicep build --file azure/infrastructure/main.bicep --stdout > /dev/null
          az bicep build --file azure/infrastructure/network/main.bicep --stdout > /dev/null
          python3 azure/infrastructure/network/check-baseline.py
          az bicep build-params --file azure/infrastructure/main.prod.bicepparam --stdout > /dev/null
          python3 -m py_compile azure/infrastructure/scripts/Test-WhatIfChanges.py
          python3 -m unittest discover -s azure/infrastructure/scripts -p 'test_*.py'
          lint="$(az bicep lint --file azure/infrastructure/main.bicep 2>&1)"
          echo "$lint"
          if echo "$lint" | grep -qi "error"; then exit 1; fi
      - name: Reference manifest is valid JSON with a snapshot per resource
        shell: pwsh
        run: |
          $manifest = Get-Content azure/infrastructure/reference/manifest.json -Raw | ConvertFrom-Json
          foreach ($r in $manifest.resources) {
            if (-not (Test-Path "azure/infrastructure/reference/snapshots/$($r.name).json")) { throw "Missing snapshot for $($r.name); run Invoke-ReferenceSnapshot.ps1 -Mode Export" }
          }
          Write-Host "$($manifest.resources.Count) reference snapshots present"

  # ARM's what-if checks that the caller could WRITE every resource in the template (it fails with
  # "Authorization failed for template resource ... Microsoft.EventHub/namespaces/write" for a
  # read-only identity), even though what-if itself changes nothing. Reconciliation therefore runs
  # as the narrowly scoped deployer identity.
  reconcile:
    name: Reconcile Bicep with Azure (changes nothing)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'what-if')
    needs: validate
    runs-on: ubuntu-latest
    environment: infra-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Compare Bicep with Azure
        run: |
          az deployment group what-if -g "$AZURE_INFRA_RESOURCE_GROUP" \
            -f azure/infrastructure/main.bicep -p azure/infrastructure/main.prod.bicepparam \
            --no-pretty-print -o json > whatif.json
          python3 azure/infrastructure/scripts/Test-WhatIfChanges.py whatif.json \
            --ignore-path properties.privateEndpointConnections \
            --ignore-path properties.blockUpgradeOfMigratedLegacyGateways \
            --ignore-path properties.enableHighBandwidthVpnGateway \
            --ignore-path 'properties.ipConfigurations[0].type' \
            --ignore-path properties.isIPv6EnabledPrivateEndpoint \
            --ignore-path properties.isMigratedLegacySKU \
            --ignore-path properties.isMigrateToCSES \
            --ignore-path properties.packetCaptureDiagnosticState \
            --ignore-path 'properties.privateDnsZoneConfigs[0].etag' \
            --ignore-path 'properties.privateDnsZoneConfigs[0].id' \
            --ignore-path 'properties.privateDnsZoneConfigs[0].properties.provisioningState' \
            --ignore-path 'properties.privateDnsZoneConfigs[0].type' \
            --ignore-path properties.virtualNetworkGatewayMigrationStatus \
            --ignore-path properties.vpnClientConfiguration.vpnClientConnectionHealth \
            --ignore-path 'properties.vpnClientConfiguration.vpnClientRootCertificates[0].id' \
            --ignore-path 'properties.vpnClientConfiguration.vpnClientRootCertificates[0].type' \
            --ignore-path properties.vpnStack

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: infra-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Give the Function App a managed identity (idempotent)
        run: |
          principal="$(az functionapp identity assign -g "$AZURE_INFRA_RESOURCE_GROUP" -n "$GAME_FUNCTION_APP" --query principalId -o tsv)"
          echo "::add-mask::$principal"
          echo "FUNCTION_APP_PRINCIPAL_ID=$principal" >> "$GITHUB_ENV"
      - name: Deploy azure/infrastructure/main.bicep (incremental)
        id: deploy
        run: |
          az deployment group create -g "$AZURE_INFRA_RESOURCE_GROUP" \
            -f azure/infrastructure/main.bicep -p azure/infrastructure/main.prod.bicepparam --mode Incremental \
            --query properties.outputs -o json > outputs.json
          echo "fqns=$(jq -r .eventHubFullyQualifiedNamespace.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "hub=$(jq -r .eventHubName.value outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Merge the telemetry settings into the Function App (never replaces)
        shell: pwsh
        run: |
          ./azure/infrastructure/scripts/Set-FunctionAppSettings.ps1 `
            -ResourceGroup $env:AZURE_INFRA_RESOURCE_GROUP `
            -FunctionAppName $env:GAME_FUNCTION_APP `
            -EventHubFullyQualifiedNamespace '${{ steps.deploy.outputs.fqns }}' `
            -EventHubName '${{ steps.deploy.outputs.hub }}' `
            -ConsumerGroup $env:GAME_CONSUMER_GROUP
      - name: Verify Event Hub private-access prerequisites
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-EventHubPrivateAccess.ps1
      - name: Verify DNS Private Resolver
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-DnsPrivateResolver.ps1
      - name: Verify Point-to-Site VPN gateway
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-P2sVpnGateway.ps1
      - name: Verify SignalR private endpoint
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-SignalRPrivateEndpoint.ps1
      - name: Verify game Function private endpoint
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-GameFunctionPrivateEndpoint.ps1
      - name: Verify game storage blob private endpoint
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-GameStorageBlobPrivateEndpoint.ps1
      - name: Reference resources still match their snapshots
        shell: pwsh
        run: ./azure/infrastructure/scripts/Invoke-ReferenceSnapshot.ps1 -Mode Check

  network-what-if:
    name: Network baseline preview (no changes)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'network-what-if' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: infra-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate and preview captured network
        shell: pwsh
        run: ./azure/infrastructure/network/Preview-Network.ps1
