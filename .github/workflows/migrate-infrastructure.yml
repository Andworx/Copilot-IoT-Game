name: Migrate remaining infrastructure

on:
  pull_request:
    paths:
      - '.github/workflows/migrate-infrastructure.yml'
      - 'azure/infrastructure/dns-bootstrap.bicep'
      - 'azure/infrastructure/service-move.json'
      - 'azure/infrastructure/roles/move-validator.json'
      - 'azure/infrastructure/roles/function-network-preflight.json'
      - 'azure/infrastructure/scripts/Invoke-FunctionMovePreflight.ps1'
      - 'azure/infrastructure/scripts/Test-FunctionMovePreflight.ps1'
      - 'azure/infrastructure/roles/stateful-mover.json'
      - 'azure/infrastructure/scripts/Grant-StatefulMoveAccess.ps1'
      - 'azure/infrastructure/scripts/Move-StatefulResources.ps1'
      - 'azure/infrastructure/scripts/Test-StatefulMove.ps1'
      - 'azure/infrastructure/service-private-endpoints.bicep'
      - 'azure/infrastructure/modules/eventhub-private-endpoint.bicep'
      - 'azure/infrastructure/modules/iothub-private-endpoint.bicep'
      - 'azure/infrastructure/modules/private-dns.bicep'
      - 'azure/infrastructure/modules/dns-private-resolver.bicep'
      - 'azure/infrastructure/network/baseline.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'DNS foundation, service private endpoints, stateful move, or temporary Function preflight'
        required: true
        default: dns-preview
        type: choice
        options: [dns-preview, dns-deploy, service-connectivity-preview, service-connectivity-deploy, validate-move, validate-stateful, detach-revalidate, move-stateful]
      confirmation:
        description: 'Confirmations: CREATE BILLABLE DESTINATION DNS; CREATE DESTINATION SERVICE PRIVATE ENDPOINTS; DETACH REVALIDATE RESTORE SOURCE FUNCTIONS; MOVE VALIDATED STATEFUL RESOURCES'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: destination-infrastructure-migration
  cancel-in-progress: false

env:
  SOURCE_SUBSCRIPTION: 2e291b4a-5f03-4dcd-bb56-09643c729adc
  DESTINATION_SUBSCRIPTION: 9e8c862e-9bba-4363-a21b-c45cabe8b637
  MIGRATION_RESOURCE_GROUP: rg-aw-azcom-iot-copilot

jobs:
  validate:
    name: Validate DNS and move boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile DNS and validate scope
        shell: pwsh
        run: |
          az bicep build --file azure/infrastructure/dns-bootstrap.bicep --outfile "$env:RUNNER_TEMP/dns-bootstrap.json"
          if ($LASTEXITCODE -ne 0) { throw 'DNS Bicep compilation failed.' }
          $json = Get-Content "$env:RUNNER_TEMP/dns-bootstrap.json" -Raw
          if ($json.Contains($env:SOURCE_SUBSCRIPTION)) { throw 'DNS template references the source subscription.' }
          $template = $json | ConvertFrom-Json -AsHashtable
          $allowed = @('Microsoft.Resources/deployments', 'Microsoft.Network/privateDnsZones', 'Microsoft.Network/privateDnsZones/virtualNetworkLinks', 'Microsoft.Network/dnsResolvers', 'Microsoft.Network/dnsResolvers/inboundEndpoints')
          function Test-DnsTemplate($current) {
            foreach ($resource in $current.resources) {
              if ($resource.type -notin $allowed) { throw "Unexpected writable resource: $($resource.type)" }
              if ($resource.ContainsKey('scope') -or $resource.ContainsKey('subscriptionId') -or $resource.ContainsKey('resourceGroup')) { throw 'Cross-scope resource is forbidden.' }
              if ($resource.type -eq 'Microsoft.Resources/deployments') { Test-DnsTemplate $resource.properties.template }
            }
          }
          Test-DnsTemplate $template
          $manifest = Get-Content azure/infrastructure/service-move.json -Raw | ConvertFrom-Json
          if ($manifest.sourceSubscriptionId -ne $env:SOURCE_SUBSCRIPTION -or $manifest.destinationSubscriptionId -ne $env:DESTINATION_SUBSCRIPTION -or $manifest.resourceGroup -ne $env:MIGRATION_RESOURCE_GROUP) { throw 'Unexpected migration scope.' }
          if (@($manifest.resources).Count -ne 13) { throw 'Expected exactly 13 reviewed service move candidates.' }
          $unique = @($manifest.resources | ForEach-Object { "$($_.type)/$($_.name)" } | Sort-Object -Unique)
          if ($unique.Count -ne 13) { throw 'Duplicate move candidate.' }
          $forbidden = @($manifest.resources | Where-Object { $_.type -like 'Microsoft.Network/*' -or $_.type -like 'Microsoft.ManagedIdentity/*' })
          if ($forbidden.Count) { throw 'Network resources and deployment identities cannot be included in this move set.' }
          $role = Get-Content azure/infrastructure/roles/move-validator.json -Raw | ConvertFrom-Json
          if (@($role.Actions).Count -ne 2 -or 'Microsoft.Resources/subscriptions/resourceGroups/validateMoveResources/action' -notin $role.Actions -or 'Microsoft.Resources/subscriptions/resourceGroups/read' -notin $role.Actions) { throw 'Validator role is not validation-only.' }
          az bicep build --file azure/infrastructure/service-private-endpoints.bicep --outfile "$env:RUNNER_TEMP/service-private-endpoints.json"
          if ($LASTEXITCODE -ne 0) { throw 'Service private-endpoint Bicep compilation failed.' }
          $peJson = Get-Content "$env:RUNNER_TEMP/service-private-endpoints.json" -Raw
          if ($peJson.Contains($env:SOURCE_SUBSCRIPTION)) { throw 'Destination service endpoint template references the source subscription.' }
          $peTemplate = $peJson | ConvertFrom-Json -AsHashtable
          $peAllowed = @('Microsoft.Resources/deployments','Microsoft.Network/privateEndpoints','Microsoft.Network/privateEndpoints/privateDnsZoneGroups')
          function Test-PrivateEndpointTemplate($current) {
            foreach ($resource in $current.resources) {
              if ($resource.type -notin $peAllowed) { throw "Unexpected destination endpoint resource: $($resource.type)" }
              if ($resource.ContainsKey('scope') -or $resource.ContainsKey('subscriptionId') -or $resource.ContainsKey('resourceGroup')) { throw 'Cross-scope endpoint resource is forbidden.' }
              if ($resource.type -eq 'Microsoft.Resources/deployments') { Test-PrivateEndpointTemplate $resource.properties.template }
            }
          }
          Test-PrivateEndpointTemplate $peTemplate
          az bicep build --file azure/infrastructure/function-rebuild.bicep --outfile "$env:RUNNER_TEMP/function-rebuild.json"
          if ($LASTEXITCODE -ne 0) { throw 'Function rebuild Bicep compilation failed.' }
          $rebuildSource = Get-Content azure/infrastructure/function-rebuild.bicep -Raw
          if ($rebuildSource -match "signalRId:\s*resourceId\(sourceSubscriptionId") { throw 'Function rebuild SignalR bridge still references the source subscription.' }
          Write-Host 'PASS: isolated DNS template, 13 service candidates and validator-only role.'
      - name: Test temporary Function transaction offline
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-FunctionMovePreflight.ps1
      - name: Test stateful move and RBAC offline
        shell: pwsh
        run: ./azure/infrastructure/scripts/Test-StatefulMove.ps1

  migration:
    name: Destination DNS or source Function preflight
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: infra-deploy
    env:
      AZURE_MIGRATION_FREEZE: ${{ vars.AZURE_MIGRATION_FREEZE || 'false' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Require main and acknowledgement
        shell: pwsh
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Migration workflow runs from main only.' }
          if ($env:REQUESTED_ACTION -notin @('dns-preview', 'dns-deploy', 'service-connectivity-preview', 'service-connectivity-deploy', 'validate-move', 'validate-stateful', 'detach-revalidate', 'move-stateful')) { throw 'Invalid migration action.' }
          if ($env:REQUESTED_ACTION -eq 'dns-deploy' -and $env:CONFIRMATION -cne 'CREATE BILLABLE DESTINATION DNS') { throw 'Explicit acknowledgement of additional DNS resolver charges is required.' }
          if ($env:REQUESTED_ACTION -eq 'service-connectivity-deploy' -and $env:CONFIRMATION -cne 'CREATE DESTINATION SERVICE PRIVATE ENDPOINTS') { throw 'Explicit acknowledgement of destination private endpoint charges is required.' }
          if ($env:REQUESTED_ACTION -eq 'detach-revalidate' -and $env:CONFIRMATION -cne 'DETACH REVALIDATE RESTORE SOURCE FUNCTIONS') { throw 'Explicit temporary source interruption acknowledgement is required.' }
          if ($env:REQUESTED_ACTION -eq 'move-stateful' -and ($env:CONFIRMATION -cne 'MOVE VALIDATED STATEFUL RESOURCES' -or $env:AZURE_MIGRATION_FREEZE -cne 'true')) { throw 'Stateful move requires exact acknowledgement and production release freeze.' }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ (inputs.action == 'validate-move' || inputs.action == 'validate-stateful' || inputs.action == 'detach-revalidate' || inputs.action == 'move-stateful') && '2e291b4a-5f03-4dcd-bb56-09643c729adc' || '9e8c862e-9bba-4363-a21b-c45cabe8b637' }}
      - name: Validate and preview destination service private endpoints
        if: inputs.action == 'service-connectivity-preview' || inputs.action == 'service-connectivity-deploy'
        shell: pwsh
        run: |
          $account = az account show --query id --only-show-errors -o tsv
          if ($LASTEXITCODE -ne 0 -or $account -ne $env:DESTINATION_SUBSCRIPTION) { throw 'Wrong destination subscription.' }
          $vnetId = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/Microsoft.Network/virtualNetworks/iot-demo-vnet"
          foreach ($subnet in @('private-endpoint','function-integration')) {
            $state = az network vnet subnet show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --vnet-name iot-demo-vnet --name $subnet --query provisioningState --only-show-errors -o tsv
            if ($LASTEXITCODE -ne 0 -or $state -ne 'Succeeded') { throw "Destination subnet $subnet is not ready." }
          }
          $eventId = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/Microsoft.EventHub/namespaces/evhns-aw-iot-copilot"
          $hubId = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/Microsoft.Devices/IotHubs/iothub-aw-iot-copilot"
          foreach ($id in @($eventId,$hubId)) { az resource show --ids $id --query id --only-show-errors -o tsv | Out-Null; if ($LASTEXITCODE -ne 0) { throw "Moved service target not found: $id" } }
          foreach ($zone in @('privatelink.servicebus.windows.net','privatelink.azure-devices.net')) { az network private-dns zone show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name $zone --query name --only-show-errors -o tsv | Out-Null; if ($LASTEXITCODE -ne 0) { throw "Destination DNS zone missing: $zone" } }
          az deployment group validate --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-service-private-endpoints --template-file azure/infrastructure/service-private-endpoints.bicep --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Private endpoint ARM validation failed.' }
          az deployment group what-if --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-service-private-endpoints --template-file azure/infrastructure/service-private-endpoints.bicep --no-pretty-print --only-show-errors -o json > "$env:RUNNER_TEMP/service-private-endpoints-whatif.json"
          if ($LASTEXITCODE -ne 0) { throw 'Private endpoint what-if failed.' }
          $preview = Get-Content "$env:RUNNER_TEMP/service-private-endpoints-whatif.json" -Raw | ConvertFrom-Json
          if ($null -eq $preview.changes) { throw 'Missing private endpoint change list.' }
          $scope = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/".ToLowerInvariant()
          $allowed = @(
            'microsoft.network/privateendpoints/iot-migration-eventhub-pe',
            'microsoft.network/privateendpoints/iot-migration-eventhub-pe/privatednszonegroups/default',
            'microsoft.network/privateendpoints/iot-migration-iothub-pe',
            'microsoft.network/privateendpoints/iot-migration-iothub-pe/privatednszonegroups/default',
            'microsoft.resources/deployments/destination-eventhub-pe',
            'microsoft.resources/deployments/destination-iothub-pe'
          )
          $retained = @(
            'microsoft.alertsmanagement/smartdetectoralertrules/failure anomalies - func-aw-azcom-iot-game'
          )
          foreach ($change in $preview.changes) {
            $id = $change.resourceId.ToLowerInvariant()
            if (-not $id.StartsWith($scope)) { throw "Unexpected endpoint scope: $id" }
            $relative = $id.Substring($scope.Length)
            "- $($change.changeType): $($change.resourceId)" >> $env:GITHUB_STEP_SUMMARY
            if ($relative -in $retained) {
              if ($change.changeType -notin @('Ignore','NoChange')) { throw "Endpoint repair refuses $($change.changeType) on retained resource $id." }
              continue
            }
            if ($relative -notin $allowed) { throw "Unexpected private endpoint resource: $id" }
            $allowedChanges = @('Create','NoChange')
            if ($relative.StartsWith('microsoft.resources/deployments/')) { $allowedChanges += @('Deploy','Ignore') }
            if ($change.changeType -notin $allowedChanges) { throw "Endpoint repair refuses $($change.changeType) on $id." }
          }
      - name: Deploy destination service private endpoints only
        if: inputs.action == 'service-connectivity-deploy'
        shell: pwsh
        run: |
          az deployment group create --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-service-private-endpoints --template-file azure/infrastructure/service-private-endpoints.bicep --mode Incremental --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Destination service endpoint deployment failed; source endpoints remain intact.' }
      - name: Repair moved IoT Hub identity endpoint subscription reference
        if: inputs.action == 'service-connectivity-deploy'
        shell: pwsh
        run: |
          $account = az account show --query id --only-show-errors -o tsv
          if ($LASTEXITCODE -ne 0 -or $account -ne $env:DESTINATION_SUBSCRIPTION) { throw 'IoT Hub repair is not authenticated to the destination subscription.' }
          $beforeJson = az iot hub message-endpoint show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --hub-name iothub-aw-iot-copilot --endpoint-name endpoint-iotpanel --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the moved IoT Hub endpoint; no update attempted.' }
          $before = $beforeJson | ConvertFrom-Json
          if ($before.authenticationType -ne 'identityBased' -or $before.endpointUri -ne 'sb://evhns-aw-iot-copilot.servicebus.windows.net' -or $before.entityPath -ne 'iot-telemetry' -or $before.resourceGroup -ne $env:MIGRATION_RESOURCE_GROUP) { throw 'Moved IoT Hub endpoint does not match the approved identity-based baseline.' }
          if ($before.subscriptionId -eq $env:DESTINATION_SUBSCRIPTION) {
            'IoT Hub identity endpoint already references the destination subscription.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            if ($before.subscriptionId -ne $env:SOURCE_SUBSCRIPTION) { throw 'IoT Hub endpoint has an unexpected subscription; refusing update.' }
            az iot hub message-endpoint update eventhub --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --hub-name iothub-aw-iot-copilot --endpoint-name endpoint-iotpanel --endpoint-resource-group $env:MIGRATION_RESOURCE_GROUP --endpoint-subscription-id $env:DESTINATION_SUBSCRIPTION --only-show-errors -o none
            if ($LASTEXITCODE -ne 0) { throw 'IoT Hub endpoint subscription reference update failed.' }
          }
          $afterJson = az iot hub message-endpoint show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --hub-name iothub-aw-iot-copilot --endpoint-name endpoint-iotpanel --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the moved IoT Hub endpoint.' }
          $after = $afterJson | ConvertFrom-Json
          if ($after.authenticationType -ne 'identityBased' -or $after.subscriptionId -ne $env:DESTINATION_SUBSCRIPTION -or $after.entityPath -ne 'iot-telemetry' -or $after.endpointUri -ne 'sb://evhns-aw-iot-copilot.servicebus.windows.net' -or $after.resourceGroup -ne $env:MIGRATION_RESOURCE_GROUP -or $after.connectionString) { throw 'IoT Hub endpoint post-update verification failed or key authentication appeared.' }
          $routeJson = az iot hub route list --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --hub-name iothub-aw-iot-copilot --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the IoT telemetry route.' }
          $route = @($routeJson | ConvertFrom-Json | Where-Object name -eq 'route-iotpanel')
          if ($route.Count -ne 1 -or -not $route[0].isEnabled -or 'endpoint-iotpanel' -notin $route[0].endpointNames) { throw 'IoT Hub telemetry route changed or is disabled.' }
          'IoT Hub endpoint remains identity-based with no connection string and references the destination Event Hubs subscription.' >> $env:GITHUB_STEP_SUMMARY
      - name: Verify destination service endpoints and DNS
        if: inputs.action == 'service-connectivity-deploy'
        shell: pwsh
        run: |
          $expected = @(
            @{name='iot-migration-eventhub-pe';target="/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/Microsoft.EventHub/namespaces/evhns-aw-iot-copilot"},
            @{name='iot-migration-iothub-pe';target="/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/Microsoft.Devices/IotHubs/iothub-aw-iot-copilot"}
          )
          foreach ($item in $expected) {
            $peJson = az network private-endpoint show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name $item.name --only-show-errors -o json
            if ($LASTEXITCODE -ne 0) { throw "Destination endpoint missing: $($item.name)" }
            $pe = $peJson | ConvertFrom-Json
            if ($pe.provisioningState -ne 'Succeeded' -or $pe.privateLinkServiceConnections[0].privateLinkServiceId -ine $item.target -or $pe.privateLinkServiceConnections[0].privateLinkServiceConnectionState.status -ne 'Approved') { throw "Destination endpoint invalid: $($item.name)" }
            if (@($pe.networkInterfaces).Count -ne 1 -or -not $pe.networkInterfaces[0].id) { throw "Destination endpoint NIC missing: $($item.name)" }
            $ips = az network nic show --subscription $env:DESTINATION_SUBSCRIPTION --ids $pe.networkInterfaces[0].id --query "ipConfigurations[].privateIPAddress" --only-show-errors -o json
            if ($LASTEXITCODE -ne 0 -or @($ips | ConvertFrom-Json).Count -eq 0) { throw "Destination endpoint IP missing: $($item.name)" }
          }
          foreach ($zone in @('privatelink.servicebus.windows.net','privatelink.azure-devices.net')) {
            $recordsJson = az network private-dns record-set a list --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --zone-name $zone --only-show-errors -o json
            if ($LASTEXITCODE -ne 0) { throw "Could not list destination DNS records for $zone" }
            $records = @($recordsJson | ConvertFrom-Json)
            if (-not $records.Count) { throw "No endpoint A records registered in $zone" }
          }
          'Destination Event Hubs and IoT Hub private endpoints are approved; source endpoints remain for rollback.' >> $env:GITHUB_STEP_SUMMARY
      - name: Validate and preview destination DNS
        if: inputs.action == 'dns-preview' || inputs.action == 'dns-deploy'
        shell: pwsh
        run: |
          $account = az account show --query id --only-show-errors -o tsv
          if ($LASTEXITCODE -ne 0 -or $account -ne $env:DESTINATION_SUBSCRIPTION) { throw 'Wrong destination subscription.' }
          $vnetState = az network vnet show --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name iot-demo-vnet --query provisioningState --only-show-errors -o tsv
          if ($LASTEXITCODE -ne 0 -or $vnetState -ne 'Succeeded') { throw 'Destination VNet must already be successfully provisioned.' }
          az deployment group validate --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-dns-bootstrap --template-file azure/infrastructure/dns-bootstrap.bicep --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Destination DNS ARM validation failed.' }
          az deployment group what-if --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-dns-bootstrap --template-file azure/infrastructure/dns-bootstrap.bicep --no-pretty-print --only-show-errors -o json > "$env:RUNNER_TEMP/dns-whatif.json"
          if ($LASTEXITCODE -ne 0) { throw 'Destination DNS preview failed.' }
          $preview = Get-Content "$env:RUNNER_TEMP/dns-whatif.json" -Raw | ConvertFrom-Json
          if ($null -eq $preview.changes) { throw 'Missing DNS preview changes.' }
          $scope = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP/providers/".ToLowerInvariant()
          $baseline = Get-Content azure/infrastructure/network/baseline.json -Raw | ConvertFrom-Json
          $allowed = @('microsoft.network/dnsresolvers/iot-demo-dns-resolver', 'microsoft.network/dnsresolvers/iot-demo-dns-resolver/inboundendpoints/iot-demo-dns-inbound', 'microsoft.resources/deployments/destination-private-dns', 'microsoft.resources/deployments/destination-dns-resolver')
          foreach ($zone in $baseline.zones) {
            $allowed += "microsoft.network/privatednszones/$($zone.name)"
            $allowed += "microsoft.network/privatednszones/$($zone.name)/virtualnetworklinks/7jkty3vvfilac"
          }
          $retained = @('microsoft.network/virtualnetworks/iot-demo-vnet', 'microsoft.network/publicipaddresses/iot-demo-vpn-pip', 'microsoft.network/virtualnetworkgateways/iot-demo-vpn')
          foreach ($change in $preview.changes) {
            $id = $change.resourceId.ToLowerInvariant()
            if (-not $id.StartsWith($scope)) { throw "Unexpected DNS scope: $id" }
            $relative = $id.Substring($scope.Length)
            if ($relative -in $retained) {
              if ($change.changeType -notin @('Ignore', 'NoChange')) { throw "DNS bootstrap refuses $($change.changeType) on retained VPN foundation: $id." }
              "- Retained $($change.changeType): $($change.resourceId)" >> $env:GITHUB_STEP_SUMMARY
              continue
            }
            if ($relative -notin $allowed) { throw "Unexpected DNS resource: $id" }
            $allowedChanges = @('Create', 'NoChange')
            if ($relative.StartsWith('microsoft.resources/deployments/')) { $allowedChanges += @('Deploy', 'Ignore') }
            if ($change.changeType -notin $allowedChanges) { throw "DNS bootstrap refuses $($change.changeType) on $id." }
            "- $($change.changeType): $($change.resourceId)" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Deploy destination DNS only
        if: inputs.action == 'dns-deploy'
        shell: pwsh
        run: |
          az deployment group create --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --name destination-dns-bootstrap --template-file azure/infrastructure/dns-bootstrap.bicep --mode Incremental --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw 'Destination DNS deployment failed. Source DNS and router remain untouched.' }
      - name: Verify destination DNS foundation
        if: inputs.action == 'dns-deploy'
        shell: pwsh
        run: |
          $scope = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP"
          $resolverJson = az resource show --ids "$scope/providers/Microsoft.Network/dnsResolvers/iot-demo-dns-resolver/inboundEndpoints/iot-demo-dns-inbound" --api-version 2022-07-01 --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the destination resolver endpoint.' }
          $endpoint = $resolverJson | ConvertFrom-Json
          if ($endpoint.properties.provisioningState -ne 'Succeeded' -or $endpoint.properties.ipConfigurations[0].privateIpAddress -ne '10.20.3.4') { throw 'DNS resolver endpoint differs from the approved foundation.' }
          $baseline = Get-Content azure/infrastructure/network/baseline.json -Raw | ConvertFrom-Json
          foreach ($zone in $baseline.zones) {
            $linkJson = az resource show --ids "$scope/providers/Microsoft.Network/privateDnsZones/$($zone.name)/virtualNetworkLinks/7jkty3vvfilac" --api-version 2020-06-01 --only-show-errors -o json
            if ($LASTEXITCODE -ne 0) { throw "Could not read DNS link for $($zone.name)." }
            $link = $linkJson | ConvertFrom-Json
            if ($link.properties.provisioningState -ne 'Succeeded' -or $link.properties.registrationEnabled -ne $false -or $link.properties.virtualNetwork.id -ine "$scope/providers/Microsoft.Network/virtualNetworks/iot-demo-vnet") { throw "DNS link differs for $($zone.name)." }
          }
          'Destination DNS foundation provisioned: five zones/links and resolver inbound 10.20.3.4. VPN/client testing remains deferred by owner; source DNS/router are unchanged.' >> $env:GITHUB_STEP_SUMMARY
      - name: Validate service move without changing source resources
        if: inputs.action == 'validate-move' || inputs.action == 'validate-stateful'
        shell: pwsh
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          $manifest = Get-Content azure/infrastructure/service-move.json -Raw | ConvertFrom-Json
          $candidates = @($manifest.resources)
          if ($env:REQUESTED_ACTION -eq 'validate-stateful') {
            $candidates = @($candidates | Where-Object { $_.type -notlike 'Microsoft.Web/*' })
            if ($candidates.Count -ne 9) { throw 'Expected nine stateful/monitoring candidates, excluding old Function apps and plans.' }
          }
          $sourceJson = az resource list --subscription $env:SOURCE_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --query '[].{id:id,name:name,type:type}' --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read source inventory.' }
          $source = @($sourceJson | ConvertFrom-Json)
          $destinationJson = az resource list --subscription $env:DESTINATION_SUBSCRIPTION --resource-group $env:MIGRATION_RESOURCE_GROUP --query '[].{id:id,name:name,type:type}' --only-show-errors -o json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read destination inventory.' }
          $destination = @($destinationJson | ConvertFrom-Json)
          $ids = @()
          foreach ($candidate in $candidates) {
            $match = @($source | Where-Object { $_.name -eq $candidate.name -and $_.type -eq $candidate.type })
            if ($match.Count -ne 1) { throw "Expected one source resource: $($candidate.type)/$($candidate.name)." }
            if (@($destination | Where-Object { $_.name -eq $candidate.name -and $_.type -eq $candidate.type }).Count) { throw "Destination already contains move candidate: $($candidate.name)." }
            $ids += $match[0].id
            "- Move validation candidate: $($match[0].id)" >> $env:GITHUB_STEP_SUMMARY
          }
          $sourceScope = "/subscriptions/$env:SOURCE_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP"
          $destinationScope = "/subscriptions/$env:DESTINATION_SUBSCRIPTION/resourceGroups/$env:MIGRATION_RESOURCE_GROUP"
          @{resources = $ids; targetResourceGroup = $destinationScope} | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/move-request.json" -Encoding utf8
          az resource invoke-action --subscription $env:SOURCE_SUBSCRIPTION --ids $sourceScope --action validateMoveResources --request-body "@$env:RUNNER_TEMP/move-request.json" --only-show-errors -o json 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/move-validation.txt"
          if ($LASTEXITCODE -ne 0) { throw 'ARM move validation failed. Inspect provider errors and validator-role access; do not detach networking or retry a move.' }
          'ARM move validation passed. No resources were moved, deleted, detached or reconfigured. A separate reviewed move action and explicit outage acceptance are still required.' >> $env:GITHUB_STEP_SUMMARY
      - name: Temporarily detach Functions, revalidate, and restore
        if: inputs.action == 'detach-revalidate'
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: ./azure/infrastructure/scripts/Invoke-FunctionMovePreflight.ps1 -OutputDirectory $env:RUNNER_TEMP -Confirmation $env:CONFIRMATION
      - name: Move validated stateful resources and restore data access
        if: inputs.action == 'move-stateful'
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: ./azure/infrastructure/scripts/Move-StatefulResources.ps1 -OutputDirectory $env:RUNNER_TEMP -Confirmation $env:CONFIRMATION
      - name: Restore source Function integrations from snapshot
        if: always() && inputs.action == 'detach-revalidate'
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: ./azure/infrastructure/scripts/Invoke-FunctionMovePreflight.ps1 -OutputDirectory $env:RUNNER_TEMP -Confirmation $env:CONFIRMATION -RestoreOnly
      - name: Record run and commit
        if: always()
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-preview-and-validation
          path: |
            ${{ runner.temp }}/dns-whatif.json
            ${{ runner.temp }}/move-request.json
            ${{ runner.temp }}/move-validation.txt
            ${{ runner.temp }}/function-integration-snapshot.json
            ${{ runner.temp }}/function-preflight-result.json
            ${{ runner.temp }}/function-recovery-result.json
            ${{ runner.temp }}/stateful-move-snapshot.json
            ${{ runner.temp }}/stateful-move-request.json
            ${{ runner.temp }}/stateful-move-validation.txt
            ${{ runner.temp }}/stateful-move-started.json
            ${{ runner.temp }}/stateful-move-result.json
          if-no-files-found: ignore