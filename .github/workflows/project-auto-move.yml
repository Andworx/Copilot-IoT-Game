name: Project Auto-Move on PR Status

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  move-issue-on-pr-change:
    runs-on: ubuntu-latest
    steps:
      - name: Get linked issue from PR body
        id: get-issue
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # Strip HTML comments first so template placeholder text (e.g. <!-- Fixes #123 -->) is ignored
          # Extract issue number from PR body (e.g., "Fixes #123")
          ISSUE_NUMBER=$(printf '%s' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs' | grep -oP '(?i)(Fixes|Closes|Resolves)\s+#\K[0-9]+' | head -1 || true)
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Resolve linked issue node id
        if: steps.get-issue.outputs.issue_number != ''
        id: issue-node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          ISSUE_NODE_ID=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" --jq '.node_id')
          echo "issue_node_id=${ISSUE_NODE_ID}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Validate org project token access
        if: steps.get-issue.outputs.issue_number != ''
        id: project-access
        run: |
          if [ -z "${PROJECT_NUMBER}" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
          elif gh project view "$PROJECT_NUMBER" --owner Andworx >/dev/null 2>&1; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.COPILOT_IOT_GAME_PROJECT_NUMBER }}
        shell: bash

      - name: Project move skipped due to token access
        if: steps.get-issue.outputs.issue_number != '' && steps.project-access.outputs.ok != 'true'
        run: |
          echo "Skipping project status move: set COPILOT_IOT_GAME_PROJECT_NUMBER and ensure token can access that org project."
          echo "Fix PAT_PROJECT by authorizing it for Andworx org and scopes repo, read:project, write:project."
        shell: bash

      - name: Handle PR opened/reopened/edited - Move to In Review
        if: github.event.action != 'closed' && steps.get-issue.outputs.issue_number != '' && steps.project-access.outputs.ok == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
          organization: Andworx
          project_id: ${{ vars.COPILOT_IOT_GAME_PROJECT_NUMBER }}
          resource_node_id: ${{ steps.issue-node.outputs.issue_node_id }}
          status_value: "In Review"

      - name: Handle PR merged - Move to Done and close issue
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.get-issue.outputs.issue_number != '' && steps.project-access.outputs.ok == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
          organization: Andworx
          project_id: ${{ vars.COPILOT_IOT_GAME_PROJECT_NUMBER }}
          resource_node_id: ${{ steps.issue-node.outputs.issue_node_id }}
          status_value: "Done"

      - name: Close linked issue on PR merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.get-issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason "completed"
        shell: bash

      - name: Handle PR closed (unmerged) - Move back to In Progress
        if: github.event.action == 'closed' && github.event.pull_request.merged == false && steps.get-issue.outputs.issue_number != '' && steps.project-access.outputs.ok == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PAT_PROJECT || secrets.GITHUB_TOKEN }}
          organization: Andworx
          project_id: ${{ vars.COPILOT_IOT_GAME_PROJECT_NUMBER }}
          resource_node_id: ${{ steps.issue-node.outputs.issue_node_id }}
          status_value: "In Progress"

      - name: Sync issue status label with PR lifecycle
        if: steps.get-issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue_number }}
          TARGET_REPO: ${{ github.repository }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          NEW_STATUS="status:in-review"
          if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            NEW_STATUS="status:done"
          elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "false" ]; then
            NEW_STATUS="status:in-progress"
          fi

          CURRENT_LABELS=$(gh api "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}" --jq '.labels[].name' || true)
          FILTERED=$(printf '%s\n' "$CURRENT_LABELS" | grep -Ev '^status:(backlog|in-progress|in-review|done)$' || true)
          LABELS_JSON=$(printf '%s\n' "$FILTERED" | sed '/^$/d' | jq -R . | jq -s .)
          LABELS_JSON=$(echo "$LABELS_JSON" | jq --arg status "$NEW_STATUS" '. + [$status] | unique')

          gh api --method PATCH "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}" --input <(
            jq -n --argjson labels "$LABELS_JSON" '{labels: $labels}'
          ) >/dev/null
