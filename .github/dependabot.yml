version: 2

updates:
  # GitHub Actions workflows (required for all projects)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # Root-level Node.js dependencies (for example Playwright at repo root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # Add additional npm entries as needed for project-specific package roots.
  # Examples:
  # - package-ecosystem: npm
  #   directory: /apps/my-function-app
  # - package-ecosystem: npm
  #   directory: /power pages/my-spa
